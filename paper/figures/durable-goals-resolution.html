<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Durable Goals resolution architecture</title><style>body{margin:0;background:#f5f5f5}svg{display:block;width:960px;height:500px}</style></head><body>
<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="resolution-title resolution-desc">
<title id="resolution-title">Immutable goal resolution</title><desc id="resolution-desc">A writable gateway selects immutable canonical records. The resolver derives desired and active contracts and a disposable status projection.</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker><marker id="arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#eb6c36"/></marker></defs>
<rect width="960" height="500" fill="#f5f5f5"/><text x="32" y="32" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#4f5d75" letter-spacing="1.5">IMMUTABLE GOAL RESOLUTION</text><text x="32" y="64" font-family="Georgia,serif" font-size="28" fill="#2d3142">Only the gateway advances</text><text x="32" y="88" font-family="Arial,sans-serif" font-size="14" fill="#4f5d75">Every selected revision remains read-only and checksum-bound.</text>
<!-- zones -->
<rect x="32" y="112" width="296" height="292" rx="8" fill="#ececec" stroke="#bfc0c0"/><text x="48" y="136" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#4f5d75">AUTHORITATIVE PACKAGE</text>
<rect x="352" y="112" width="216" height="292" rx="8" fill="#ececec" stroke="#bfc0c0"/><text x="368" y="136" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#4f5d75">DETERMINISTIC CORE</text>
<rect x="592" y="112" width="336" height="292" rx="8" fill="#ececec" stroke="#bfc0c0"/><text x="608" y="136" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#4f5d75">RESOLVED VIEWS</text>
<!-- arrows -->
<path d="M304 192H336Q344 192 344 200V216Q344 224 352 224H376" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arr)"/><path d="M304 296H336Q344 296 344 288V264Q344 256 352 256H376" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arr)"/>
<line x1="544" y1="216" x2="624" y2="216" stroke="#eb6c36" stroke-width="2" marker-end="url(#arr-a)"/><line x1="544" y1="284" x2="624" y2="284" stroke="#4f5d75" stroke-width="2" marker-end="url(#arr)"/><path d="M488 332V356Q488 364 496 364H624" fill="none" stroke="#7a8399" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
<text x="584" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#eb6c36">DESIRED</text><text x="584" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#4f5d75">ACTIVE</text>
<!-- package nodes -->
<rect x="56" y="152" width="248" height="64" rx="6" fill="#fff" stroke="#2d3142" stroke-width="2"/><text x="180" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#2d3142">gateway.json</text><text x="180" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#4f5d75">writable checksum pointer</text>
<rect x="56" y="240" width="248" height="112" rx="6" fill="#fff" stroke="#4f5d75" stroke-width="2"/><text x="180" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#2d3142">Immutable records</text><text x="180" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#4f5d75">contract · amendments</text><text x="180" y="314" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#4f5d75">activations · evidence</text><text x="180" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#eb6c36">numbered, read-only history</text>
<!-- resolver -->
<rect x="376" y="168" width="168" height="164" rx="6" fill="#fff" stroke="#2d3142" stroke-width="2"/><text x="460" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#2d3142">Resolver</text><line x1="400" y1="216" x2="520" y2="216" stroke="#bfc0c0"/><text x="400" y="244" font-family="Arial,sans-serif" font-size="14" fill="#4f5d75">1. verify bytes</text><text x="400" y="272" font-family="Arial,sans-serif" font-size="14" fill="#4f5d75">2. replay revisions</text><text x="400" y="300" font-family="Arial,sans-serif" font-size="14" fill="#4f5d75">3. evaluate evidence</text>
<!-- outputs -->
<rect x="624" y="168" width="272" height="72" rx="6" fill="#fff3ed" stroke="#eb6c36" stroke-width="2"/><text x="760" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#2d3142">Desired contract</text><text x="760" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#4f5d75">base + every amendment</text>
<rect x="624" y="260" width="272" height="72" rx="6" fill="#fff" stroke="#2d3142" stroke-width="2"/><text x="760" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#2d3142">Active contract</text><text x="760" y="314" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#4f5d75">base + activated prefix</text>
<rect x="624" y="352" width="272" height="40" rx="6" fill="#f5f5f5" stroke="#7a8399" stroke-width="2" stroke-dasharray="6 5"/><text x="760" y="378" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#4f5d75">STATUS.json · disposable</text>
<line x1="32" y1="432" x2="928" y2="432" stroke="#bfc0c0"/><text x="32" y="460" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#2d3142">Example:</text><text x="108" y="460" font-family="Arial,sans-serif" font-size="15" fill="#2d3142">active r1 fails (0.87 &lt; 0.90)</text><text x="384" y="460" font-family="Arial,sans-serif" font-size="15" fill="#2d3142">desired r2 passes (0.87 ≥ 0.85)</text><text x="696" y="460" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#eb6c36">r2 still pending</text><text x="32" y="486" font-family="Arial,sans-serif" font-size="13" fill="#4f5d75">A satisfied guard permits activation; it never activates a revision automatically.</text>
